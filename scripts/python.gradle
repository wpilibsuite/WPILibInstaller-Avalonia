apply plugin: 'de.undercouch.download'
apply from: 'scripts/versions.gradle'

def targetTriples = [
    'Windows'   : 'x86_64-pc-windows-msvc',
    'Linux'     : 'x86_64-unknown-linux-gnu',
    'LinuxArm64': 'aarch64-unknown-linux-gnu',
    'Mac'       : 'x86_64-apple-darwin',
    'MacArm'    : 'aarch64-apple-darwin',
]

def targetTriple = targetTriples[project.ext.buildClassifier]

def pythonArchiveName = "cpython-${pythonVersion}+${pythonStandaloneRelease}-${targetTriple}-install_only_stripped.tar.gz".toString()
def pythonUrl = "https://github.com/astral-sh/python-build-standalone/releases/download/${pythonStandaloneRelease}/${pythonArchiveName}"

def uvIsZip = project.ext.buildClassifier == 'Windows'
def uvArchiveName = "uv-${targetTriple}.${uvIsZip ? 'zip' : 'tar.gz'}".toString()
def uvUrl = "https://github.com/astral-sh/uv/releases/download/${uvVersion}/${uvArchiveName}"

def pythonDownload = tasks.register('pythonDownload', Download) {
    src pythonUrl
    dest "$buildDir/downloads/$pythonArchiveName"
    overwrite false
}

def uvDownload = tasks.register('uvDownload', Download) {
    src uvUrl
    dest "$buildDir/downloads/$uvArchiveName"
    overwrite false
}

def pythonConfigFile = file("$buildDir/pythonconfig.json")

def pythonTask = tasks.register('pythonConfig', Task) {
    inputs.property 'pythonArchiveName', pythonArchiveName

    it.outputs.file pythonConfigFile

    doLast {
        def config = [:]
        config['folder'] = 'python'
        config['version'] = pythonVersion
        config['archiveFolder'] = 'pythondist'
        config['archiveFile'] = pythonArchiveName
        config['uvFolder'] = 'uv'

        def gbuilder = getGsonBuilder()

        gbuilder.setPrettyPrinting()
        def json = gbuilder.create().toJson(config)

        pythonConfigFile.parentFile.mkdirs()

        pythonConfigFile.text = json
    }
}

ext.pythonConfigFileSetup = { AbstractArchiveTask zip ->
    zip.dependsOn pythonTask
    zip.inputs.file pythonConfigFile

    zip.from(pythonConfigFile) {
        rename { 'pythonConfig.json' }
    }
}

ext.pythonZipSetup = { AbstractArchiveTask zip ->
    zip.dependsOn pythonDownload
    zip.dependsOn uvDownload
    zip.dependsOn pythonTask

    zip.inputs.file pythonConfigFile

    zip.from(pythonDownload.get().outputFiles.first()) {
        into '/pythondist'
    }

    def uvArchive = uvDownload.get().outputFiles.first()
    def uvTree = uvIsZip ? project.zipTree(uvArchive) : project.tarTree(project.resources.gzip(uvArchive))
    zip.from(uvTree) {
        include '**/uv', '**/uvx', '**/uv.exe', '**/uvx.exe', '**/uvw.exe'
        eachFile { f ->
            f.path = "uv/${f.name}"
        }
        filePermissions { unix(0755) }
        includeEmptyDirs = false
    }

    zip.from(pythonConfigFile) {
        into '/installUtils'
        rename { 'pythonConfig.json' }
    }
}
